<!-- Variations de logos SVG simples -->

<!-- Logo 1: Minimaliste avec initiales -->
<svg id="logo-minimal" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="100" height="100" rx="20" fill="none" stroke="#333" stroke-width="2" />
    <text x="60" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle"
        fill="#333">L</text>
</svg>

<!-- Logo 2: Géométrique moderne -->
<svg id="logo-geometric" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#333" stroke-width="3" />
    <polygon points="60,25 85,45 85,75 60,95 35,75 35,45" fill="#333" opacity="0.7" />
    <circle cx="60" cy="60" r="12" fill="#333" />
</svg>

<!-- Logo 3: Abstrait et créatif -->
<svg id="logo-abstract" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 60 Q60 20 100 60 Q60 100 20 60" fill="#333" opacity="0.8" />
    <circle cx="45" cy="50" r="8" fill="white" />
    <circle cx="75" cy="70" r="6" fill="white" />
</svg>

<!-- Logo 4: Tech/Digital -->
<svg id="logo-tech" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="20" width="80" height="80" fill="none" stroke="#333" stroke-width="2" />
    <rect x="35" y="35" width="15" height="15" fill="#333" />
    <rect x="70" y="35" width="15" height="15" fill="#333" />
    <rect x="35" y="70" width="50" height="15" fill="#333" />
    <circle cx="60" cy="60" r="25" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
</svg>

<!-- Logo 5: Organique et fluide -->
<svg id="logo-organic" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 60 C30 30, 90 30, 90 60 C90 90, 30 90, 30 60 Z" fill="none" stroke="#333" stroke-width="3" />
    <ellipse cx="50" cy="50" rx="12" ry="8" fill="#333" opacity="0.6" />
    <ellipse cx="70" cy="70" rx="8" ry="12" fill="#333" opacity="0.6" />
</svg>
